name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "e.g. livestylesync@0.1.2"
    validations:
      required: true

  - type: input
    id: framework
    attributes:
      label: Framework
      placeholder: "e.g. Vite + React, Next.js 14, Nuxt 3"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select element
        2. Change color
        3. Click Apply
        4. Error shown: "..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant config (vite.config / next.config / CSS file snippet)
      render: typescript
