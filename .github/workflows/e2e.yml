name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: |
          pnpm --filter livestylesync-server-core build
          pnpm --filter livestylesync-overlay build
          pnpm --filter livestylesync-vite-plugin build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/demo

      - name: Run E2E tests
        run: pnpm --filter demo test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/demo/playwright-report/
          retention-days: 7
