name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter livestylesync-server-core build
          pnpm --filter livestylesync-overlay build
          pnpm --filter livestylesync-vite-plugin build
          pnpm --filter livestylesync-webpack-plugin build
          pnpm --filter livestylesync-nextjs build
          pnpm --filter livestylesync build

      - name: Run tests
        run: |
          pnpm --filter livestylesync-server-core test
          pnpm --filter livestylesync-overlay test

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
